version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: va-cms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "VaCms_Dev!2026"
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    volumes:
      - va-cms-sqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "VaCms_Dev!2026",
          "-Q",
          "SELECT 1",
          "-C",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Local SMTP sink for workflow emails (issue #39): `docker compose --profile mail up -d`,
  # then point the API at it (Email__Smtp__Host=localhost, Port 1025, Security None) and
  # read the mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: va-cms-mailpit
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # ClamAV for the upload virus scan (issue #159): `docker compose --profile clamav up -d`,
  # then Media__Scanner__Mode=ClamAv (host localhost, port 3310). The integration test
  # that uploads EICAR runs when CLAMAV_HOST is set (see Issue159AcceptanceTests).
  # First start downloads signatures; wait for the healthcheck before scanning.
  clamav:
    image: clamav/clamav-debian:stable   # multi-arch (amd64/arm64)
    container_name: va-cms-clamav
    profiles: ["clamav"]
    ports:
      - "3310:3310"
    volumes:
      - va-cms-clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  va-cms-sqldata:
  va-cms-clamav-db:
