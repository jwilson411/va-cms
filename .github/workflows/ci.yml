# CI (#161): build, test and package every deployable on pull requests and on
# pushes to main. Security scanning lives in security.yml. Both are required
# status checks on main (see docs/DEVELOPER_GUIDE.md → Branch protection).
#
# On-prem: every job runs on the runner label in the CI_RUNNER repository/org
# variable (e.g. "self-hosted,linux,docker"), falling back to GitHub-hosted only
# where that variable is unset. Runners need Docker (Testcontainers / SQL Server
# service), .NET 8, Node 22 and access to a NuGet/npm/container mirror.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  api:
    name: API — build, test, coverage, OpenAPI drift
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}   # needs Docker for Testcontainers (SQL Server 2022)
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore (NuGetAudit fails on known advisories)
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release -warnaserror

      # OpenApiSnapshotTests is part of this run: it fails when docs/openapi.json
      # differs from the built API (regenerate with UPDATE_OPENAPI_SNAPSHOT=true).
      - name: Test with coverage
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: src/api/TestResults
          if-no-files-found: warn

      - name: Publish API
        run: dotnet publish VA.CMS.API/VA.CMS.API.csproj -c Release --no-build -o ../../artifacts/api

      - name: Upload API package
        uses: actions/upload-artifact@v7
        with:
          name: api-publish
          path: |
            artifacts/api
            migrations
            infra/sql

  admin:
    name: Admin SPA — typecheck, test, build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: src/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: src/admin/dist

  public:
    name: Public site — typecheck, test, build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: src/public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/public/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run lint
      - name: next build
        run: npm run build
        env:
          # Prerender runs without an API; pages fall back to their empty states (as locally).
          NEXT_PUBLIC_API_URL: http://localhost:5100
          CMS_API_URL: http://localhost:5100

  accessibility:
    name: Accessibility — axe against the admin SPA (API in DevBypass)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [api, admin]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "VaCms_Ci!2026x"
          MSSQL_PID: Developer
        ports:
          - 14333:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'VaCms_Ci!2026x' -Q 'SELECT 1' -C"
          --health-interval 10s --health-timeout 5s --health-retries 15 --health-start-period 30s
    env:
      CONNECTION_STRING: "Server=localhost,14333;Database=VACMS_CI;User Id=sa;Password=VaCms_Ci!2026x;TrustServerCertificate=True;Connection Timeout=15;"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Provision logins and migrate (deployment path, #157)
        working-directory: src/api
        run: |
          dotnet run --project VA.CMS.CLI -c Release -- db provision-logins \
            --connection "$CONNECTION_STRING" --app-password 'Ci!Exec#2026aZ' --readonly-password 'Ci!Read#2026bY'
          dotnet run --project VA.CMS.CLI -c Release -- db migrate --connection "$CONNECTION_STRING"
          dotnet run --project VA.CMS.CLI -c Release -- db migrate --check --connection "$CONNECTION_STRING"

      - name: Start API (DevBypass, no startup migration)
        working-directory: src/api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5100
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
          Database__MigrateOnStartup: "false"
          Auth__Mode: DevBypass
          Auth__DevBypassAllowedUsers__0: alice@va.gov
          Jwt__SigningKey: ci-only-signing-key-not-a-secret-32+
          Media__Scanner__Mode: Disabled
        run: |
          nohup dotnet run --project VA.CMS.API -c Release --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:5100/health && break; sleep 2; done
          curl -fs http://localhost:5100/health

      - name: Start admin SPA (Vite dev server proxies /api → 5100)
        working-directory: src/admin
        run: |
          npm ci
          nohup npm run dev -- --port 5173 > vite.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:5173 >/dev/null && break; sleep 2; done

      - name: Run axe suite
        working-directory: tests/accessibility
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:5100
          CI: "true"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:a11y

      - name: Upload a11y report and server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: |
            tests/accessibility/results
            src/api/api.log
            src/admin/vite.log
          if-no-files-found: warn

  e2e:
    name: E2E — redirects served through API + public site (#169)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [api, public]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "VaCms_Ci!2026x"
          MSSQL_PID: Developer
        ports:
          - 14333:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'VaCms_Ci!2026x' -Q 'SELECT 1' -C"
          --health-interval 10s --health-timeout 5s --health-retries 15 --health-start-period 30s
    env:
      CONNECTION_STRING: "Server=localhost,14333;Database=VACMS_E2E;User Id=sa;Password=VaCms_Ci!2026x;TrustServerCertificate=True;Connection Timeout=15;"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Provision logins and migrate
        working-directory: src/api
        run: |
          dotnet run --project VA.CMS.CLI -c Release -- db provision-logins \
            --connection "$CONNECTION_STRING" --app-password 'Ci!Exec#2026aZ' --readonly-password 'Ci!Read#2026bY'
          dotnet run --project VA.CMS.CLI -c Release -- db migrate --connection "$CONNECTION_STRING"

      - name: Start API (DevBypass)
        working-directory: src/api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5100
          ConnectionStrings__DefaultConnection: ${{ env.CONNECTION_STRING }}
          Database__MigrateOnStartup: "false"
          Auth__Mode: DevBypass
          Auth__DevBypassAllowedUsers__0: alice@va.gov
          Jwt__SigningKey: ci-only-signing-key-not-a-secret-32+
          Media__Scanner__Mode: Disabled
        run: |
          nohup dotnet run --project VA.CMS.API -c Release --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:5100/health && break; sleep 2; done
          curl -fs http://localhost:5100/health

      - name: Build and start public site against the API
        working-directory: src/public
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5100
          CMS_API_URL: http://localhost:5100
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3000/ >/dev/null && break; sleep 2; done
          curl -fs -o /dev/null http://localhost:3000/

      - name: Run redirect e2e suite
        working-directory: tests/accessibility
        env:
          API_URL: http://localhost:5100
          PUBLIC_URL: http://localhost:3000
          CI: "true"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/redirects.e2e.spec.ts

      - name: Upload e2e report and server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            tests/accessibility/results
            src/api/api.log
            src/public/next.log
